<div class="list-container" *ngIf="!isLoading">
      <mat-card class="product-card">
        <div class="image-wrapper">
          <img [src]="product.PicUrl" alt="{{ product.Name }}" class="product-image">
        </div>
        <mat-card-header>
          <mat-card-title>({{product.ProductCode}}) {{product.Name}}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>
            قیمت : {{product.Price | rialCurrency}}<br>
            موجودی 1: {{ product.Count1 }} {{ product.UnitName }} <br>
            موجودی 2: {{ product.Count2 }} {{ product.UnitName2 }} <br> 
          </p>
        </mat-card-content>
        <div class="quantity-selection">
          <button mat-icon-button (click)="decreaseQuantity()">
            <mat-icon>remove</mat-icon>
          </button>
          <input type="number" min="0" step="1" class="quantity-input">
          <button mat-icon-button (click)="increaseQuantity()">
            <mat-icon>add</mat-icon>
          </button>
        </div>
      </mat-card>      
    </div>
